<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>台股波段雷達 Live</title><style>
:root{--bg:#07111f;--card:#101c2f;--text:#f4f7fb;--muted:#91a6c2;--line:#263751;--g:#2ad1a3;--o:#ffb24b;--r:#ff6575;--gold:#ffd166}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#07111f,#0b1626);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}.app{max-width:1250px;margin:auto;padding:18px 14px 44px}.top,.sec,.ht{display:flex;justify-content:space-between;gap:10px;align-items:center}.top h1{margin:0}.muted{color:var(--muted);font-size:12px}.badge,.btn,.tab{border:1px solid #2a4263;background:#13233a;color:white;padding:9px 12px;border-radius:10px}.badge{border-radius:999px}.tabs{display:flex;gap:8px;overflow:auto;margin:18px 0}.tab.active{background:#08755f}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.kpi,.hc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}.kpi small,.m small,.lv small{color:var(--muted)}.kpi b{display:block;margin-top:4px}.sec{margin:17px 0 10px}.sec h2{margin:0}.table{overflow:auto;border:1px solid var(--line);border-radius:15px;background:#0d1828}.rrow{min-width:1190px;display:grid;grid-template-columns:40px 130px 95px 65px 75px 100px 100px 90px 80px 80px 80px 110px 60px;gap:7px;padding:11px;border-bottom:1px solid #223149;align-items:center}.rrow.head{background:#16263e;color:#9fb3ce;font-size:11px}.stock b{display:block}.stock small{color:var(--muted)}.g{color:var(--g)}.o{color:var(--o)}.r{color:var(--r)}.gold{color:var(--gold);font-weight:900}#holdings{display:none}.hcards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metrics,.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}.m,.lv{background:#0b1626;border-radius:9px;padding:8px}.m small,.lv small{display:block;font-size:10px}.m b,.lv b{display:block;margin-top:3px;font-size:13px}.note{margin-top:9px;padding:10px;border-radius:10px;background:#0b1626;border-left:3px solid #ffb24b;font-size:12px;line-height:1.55}.notice{margin-top:13px;background:#251c10;border:1px solid #6a4b1b;color:#ffe2a4;border-radius:13px;padding:12px;font-size:12px}@media(max-width:760px){.kpis{grid-template-columns:1fr 1fr}.hcards{grid-template-columns:1fr}.metrics,.levels{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="app"><div class="top"><div><h1>台股波段雷達 Live</h1><div class="muted">Top 20 放量突破 × 持股風控</div></div><div id="status" class="badge">讀取中</div></div><div class="tabs"><button class="tab active" data-mode="today">09:30 今日 Top 20</button><button class="tab" data-mode="after">盤後 Top 20</button><button class="tab" data-mode="holdings">我的持股</button></div><div class="kpis"><div class="kpi"><small>掃描</small><b>上市＋上櫃</b></div><div class="kpi"><small>訊號</small><b>放量＋突破</b></div><div class="kpi"><small>庫存停損</small><b>成本 -5%</b></div><div class="kpi"><small>庫存停利</small><b>成本 +15%</b></div></div>
<div id="radar"><div class="sec"><div><h2 id="rt">09:30 今日 Top 20</h2><span class="muted" id="rs">掃描中</span></div><button class="btn" onclick="loadRadar()">重新掃描</button></div><div class="table"><div class="rrow head"><div>#</div><div>股票</div><div>現價/漲幅</div><div>量比</div><div>距突破</div><div>回踩買點</div><div>突破買點</div><div>不追價</div><div>停損</div><div>目標1</div><div>目標2</div><div>階段</div><div>分數</div></div><div id="rr"></div></div></div>
<div id="holdings"><div class="sec"><div><h2>我的持股</h2><span class="muted">基本停損 -5%／停利 +15%；再依趨勢與量能給延伸建議</span></div></div><div id="hc" class="hcards"></div></div><div class="notice">提醒：延伸停損與移動停利是依價格趨勢、支撐與量能自動判斷，不代表保證走勢。</div></div><script>
const DH=[{symbol:'1303',name:'南亞',shares:80,cost:187.26},{symbol:'2303',name:'聯電',shares:90,cost:152.27},{symbol:'2313',name:'華通',shares:45,cost:240.07},{symbol:'2317',name:'鴻海',shares:35,cost:263.57},{symbol:'2356',name:'英業達',shares:100,cost:68.92},{symbol:'2376',name:'技嘉',shares:20,cost:340.10},{symbol:'2382',name:'廣達',shares:20,cost:324.60},{symbol:'2408',name:'南亞科',shares:20,cost:486.65},{symbol:'2492',name:'華新科',shares:25,cost:290.56},{symbol:'4958',name:'臻鼎-KY',shares:30,cost:645.20},{symbol:'3374',name:'精材',shares:30,cost:334.60},{symbol:'5425',name:'台半',shares:100,cost:103.53},{symbol:'6217',name:'中探針',shares:50,cost:180.06}];
let mode='today';function H(){try{let x=JSON.parse(localStorage.getItem('holdingsLive'));if(Array.isArray(x)&&x.length)return x}catch(e){}return DH}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;renderMode()});
async function status(){try{let x=await fetch('/api/status').then(r=>r.json());document.getElementById('status').textContent=x.live?'LIVE｜Fugle':'DEMO'}catch(e){status.textContent='連線錯誤'}}
async function loadRadar(){rs.textContent='掃描中...';rr.innerHTML='';try{let ep=mode==='after'?'/api/radar/afterhours':'/api/radar/intraday',x=await fetch(ep).then(r=>r.json()),rows=x.rows||[];rr.innerHTML=rows.map((r,i)=>`<div class="rrow"><div class="gold">${i+1}</div><div class="stock"><b>${r.name}</b><small>${r.symbol}</small></div><div><b>${r.price??'-'}</b><small class="${(r.changePercent||0)>=0?'r':'g'}">${r.changePercent??'-'}%</small></div><div class="g">${r.volRatio??'-'}×</div><div>${r.breakoutDistance??'-'}%</div><div class="g">${r.pullback??'-'}</div><div class="o">${r.breakout??'-'}</div><div class="r">${r.noChase??'-'}</div><div class="r">${r.stop??'-'}</div><div>${r.target1??'-'}</div><div>${r.target2??'-'}</div><div>${r.stage??'-'}</div><div class="gold">${r.score??'-'}</div></div>`).join('');rs.textContent=`${x.live?'即時資料':'DEMO'}｜顯示 ${rows.length}/20 檔`;}catch(e){rs.textContent='掃描失敗，請稍後重試'}}
function n(v){return Number(v).toFixed(2)}
async function renderHoldings(){let hs=H(),map={};hc.innerHTML='<div class="muted">持股行情讀取中...</div>';try{let q=await fetch('/api/holdings/quotes?symbols='+encodeURIComponent(hs.map(x=>x.symbol).join(','))).then(r=>r.json());(q.rows||[]).forEach(x=>map[x.symbol]=x)}catch(e){}
hc.innerHTML=hs.map(h=>{let q=map[h.symbol]||{},ok=q.price!=null&&!q.error,px=ok?Number(q.price):null,prev=Number(q.previousClose||0),pct=px?((px/h.cost)-1)*100:null,day=px&&prev?(px/prev-1)*100:null,pnl=px?(px-h.cost)*h.shares:null,stop=h.cost*.95,tp=h.cost*1.15,support=Number(q.support||0),vr=Number(q.volRatio||0),strong=!!q.trendStrong;
let extStop=(support&&support<stop&&support>=h.cost*.90)?support:stop;let stopNote=strong?'趨勢仍偏強；若主要是大盤拖累，可先觀察。跌破 '+n(extStop)+' 再執行延伸停損。':'先以成本 -5% 的 '+n(stop)+' 為主要風控。';
let tpNote='到 '+n(tp)+'（+15%）先檢查量價。';if(px&&px>=tp&&strong&&vr>=1.2)tpNote+=' 目前趨勢＋量能仍強，建議不要一次全賣，改用移動停利：以現價回落約 5% 或跌破短線支撐 '+(support?n(support):'')+' 作為出場訊號。';else if(px&&px>=tp)tpNote+=' 若量能沒有續強，可分批停利。';
return `<div class="hc"><div class="ht"><div class="stock"><b>${h.name}</b><small>${h.symbol} · ${h.shares}股</small></div><span class="gold">${px?n(px):'行情失敗'}</span></div><div class="metrics"><div class="m"><small>成本</small><b>${n(h.cost)}</b></div><div class="m"><small>即時/收盤</small><b>${px?n(px):'-'}</b></div><div class="m"><small>報酬率</small><b class="${pct!=null&&pct>=0?'r':'g'}">${pct!=null?n(pct)+'%':'-'}</b></div><div class="m"><small>今日漲跌</small><b>${day!=null?n(day)+'%':'-'}</b></div><div class="m"><small>未實現損益</small><b>${pnl!=null?Math.round(pnl).toLocaleString():'-'}</b></div><div class="m"><small>量比</small><b>${ok?vr.toFixed(2)+'×':'-'}</b></div></div><div class="levels"><div class="lv"><small>固定停損 -5%</small><b class="r">${n(stop)}</b></div><div class="lv"><small>延伸停損</small><b class="o">${n(extStop)}</b></div><div class="lv"><small>固定停利 +15%</small><b class="gold">${n(tp)}</b></div><div class="lv"><small>技術支撐</small><b class="g">${support?n(support):'-'}</b></div></div><div class="note"><b>停損備註：</b>${stopNote}<br><b>停利備註：</b>${tpNote}</div></div>`}).join('')}
function renderMode(){let hh=mode==='holdings';radar.style.display=hh?'none':'block';holdings.style.display=hh?'block':'none';if(hh)renderHoldings();else{rt.textContent=mode==='after'?'盤後 Top 20':'09:30 今日 Top 20';loadRadar()}}status();renderMode();
</script></body></html>
